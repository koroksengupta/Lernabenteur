<style>
  :root{
    --bg:#FFF9F0;
    --surface:#FFFFFF;
    --text:#2B3A55;
    --text-soft:#5B6B85;
    --deutsch:#FF6F59;
    --deutsch-soft:#FFE4DF;
    --mathe:#2C9BD1;
    --mathe-soft:#DEF2FC;
    --sach:#3FA857;
    --sach-soft:#E2F6E5;
    --star:#F5A700;
    --violet:#8B6FD8;
    --violet-soft:#EDE7FB;
    --border:#2B3A55;
    --wrong:#E85B5B;
    --shadow-off: 5px 5px 0 var(--border);
    --shadow-off-sm: 3px 3px 0 var(--border);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C29;
      --surface:#212A3C;
      --text:#F4F1EA;
      --text-soft:#AEB9CF;
      --deutsch:#FF8A73;
      --deutsch-soft:#3A2A2C;
      --mathe:#6FC3EE;
      --mathe-soft:#1E3244;
      --sach:#79D08F;
      --sach-soft:#1E3324;
      --star:#FFCF5C;
      --violet:#B3A0EA;
      --violet-soft:#2C2540;
      --border:#F4F1EA;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C29;
    --surface:#212A3C;
    --text:#F4F1EA;
    --text-soft:#AEB9CF;
    --deutsch:#FF8A73;
    --deutsch-soft:#3A2A2C;
    --mathe:#6FC3EE;
    --mathe-soft:#1E3244;
    --sach:#79D08F;
    --sach-soft:#1E3324;
    --star:#FFCF5C;
    --violet:#B3A0EA;
    --violet-soft:#2C2540;
    --border:#F4F1EA;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  @media (max-width:480px){ html{font-size:clamp(19px, 5.5vw, 22px);} }
  @media (min-width:481px) and (max-width:700px){ html{font-size:19px;} }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Fredoka', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px 14px 60px;
    -webkit-tap-highlight-color:transparent;
  }
  #app{width:100%;max-width:640px;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3{margin:0;font-weight:700;}
  p{margin:0;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---------- shared chrome ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap;row-gap:8px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mascot{font-size:2.125rem;line-height:1;}
  .brand h1{font-size:1.375rem;}
  .iconbtn{
    background:var(--surface);border:3px solid var(--border);border-radius:16px;
    padding:8px 14px;font-size:0.9375rem;font-weight:700;color:var(--text);
    box-shadow:var(--shadow-off-sm);
  }
  .iconbtn:active{transform:translate(3px,3px);box-shadow:none;}
  .iconbtn.violet{background:var(--violet-soft);border-color:var(--violet);}
  .star-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:3px solid var(--border);border-radius:20px;padding:6px 12px;font-weight:700;
    box-shadow:var(--shadow-off-sm);
  }

  /* ---------- panel ---------- */
  .panel{
    background:var(--surface);border:3px solid var(--border);border-radius:26px;
    padding:26px 22px;box-shadow:var(--shadow-off);
  }
  .lead{color:var(--text-soft);font-size:1rem;margin-bottom:18px;line-height:1.4;}

  /* ---------- map / subject hills ---------- */
  .hills{display:flex;flex-direction:column;gap:16px;}
  .hill{
    display:flex;align-items:center;gap:16px;width:100%;text-align:left;
    border:3px solid var(--border);border-radius:22px;padding:16px 18px;
    background:var(--tint);box-shadow:var(--shadow-off-sm);
  }
  .hill:active{transform:translate(3px,3px);box-shadow:none;}
  .hill .emoji{font-size:2.5rem;}
  .hill .info{flex:1;}
  .hill .info h2{font-size:1.1875rem;}
  .hill .info .meta{font-size:0.8125rem;color:var(--text-soft);margin-top:2px;}
  .hill .mastery{font-weight:700;font-size:0.9375rem;}

  /* ---------- topic stops ---------- */
  .stops{display:flex;flex-direction:column;gap:12px;}
  .stop{
    display:flex;align-items:center;gap:14px;border:3px solid var(--border);
    border-radius:18px;padding:12px 16px;background:var(--surface);box-shadow:var(--shadow-off-sm);
  }
  .stop:active{transform:translate(3px,3px);box-shadow:none;}
  .stop.locked{opacity:.5;}
  .stop.locked:active{transform:none;box-shadow:var(--shadow-off-sm);}
  .daily-banner{
    text-align:center;font-weight:700;font-size:0.875rem;color:var(--text-soft);
    background:var(--bg);border:2px solid var(--border);border-radius:14px;
    padding:9px 12px;margin-bottom:16px;
  }
  .daily-banner.done{background:var(--star);color:var(--border);border-color:var(--border);}
  .stop .emoji{font-size:1.75rem;}
  .stop .info{flex:1;text-align:left;}
  .stop .info h3{font-size:1rem;}
  .stop .badge{font-size:0.75rem;font-weight:700;background:var(--tint);border-radius:10px;padding:3px 8px;}
  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}

  /* ---------- progress bar ---------- */
  .bar{height:10px;border-radius:6px;background:var(--bg);border:2px solid var(--border);overflow:hidden;margin-top:6px;}
  .bar > div{height:100%;background:var(--fill,var(--mathe));}

  /* ---------- play view ---------- */
  .playhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .dots-progress{display:flex;gap:5px;}
  .dots-progress span{width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--border);}
  .dots-progress span.done{background:var(--star);}
  .dots-progress span.current{background:var(--tint);}
  .mascot-row{text-align:center;font-size:2.875rem;margin-bottom:6px;transition:transform .2s;}
  .prompt{text-align:center;font-size:1.1875rem;font-weight:700;margin:6px 0 14px;line-height:1.35;}
  .speakbtn{
    display:block;margin:0 auto 16px;border:3px solid var(--border);background:var(--surface);
    border-radius:16px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow-off-sm);
  }
  .speakbtn:active{transform:translate(2px,2px);box-shadow:none;}
  .visual{display:flex;align-items:center;justify-content:center;margin:8px auto 20px;min-height:70px;}
  .visual-letter{font-size:4rem;font-weight:700;color:var(--deutsch);font-family:'Andika',sans-serif;}
  .visual-emoji{font-size:4rem;}
  .visual-equation{font-size:2.125rem;font-weight:700;color:var(--mathe);}
  .visual-shape .shape-circle{width:76px;height:76px;border-radius:50%;}
  .visual-shape .shape-square{width:76px;height:76px;border-radius:12px;}
  .visual-shape .shape-rect{width:106px;height:64px;border-radius:12px;}
  .visual-shape .shape-triangle{width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:76px solid;}
  .visual-shape .shape-star{width:82px;height:82px;clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);}
  .visual-shape .shape-diamond{width:64px;height:64px;border-radius:8px;transform:rotate(45deg);}
  .visual-shape .shape-oval{width:104px;height:62px;border-radius:50%;}
  .dotgrid{display:flex;flex-wrap:wrap;gap:6px;max-width:230px;justify-content:center;}
  .dotgrid .dot{width:18px;height:18px;border-radius:50%;background:var(--mathe);}
  .visual-compare{display:flex;gap:22px;align-items:flex-start;justify-content:center;}
  .cmp-side{text-align:center;}
  .cmp-label{font-weight:700;color:var(--text-soft);margin-bottom:8px;font-size:0.8125rem;}
  .eq-dots{display:flex;gap:16px;justify-content:center;margin-top:-6px;margin-bottom:14px;}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choice{
    border:3px solid var(--border);border-radius:18px;background:var(--surface);
    padding:16px 10px;font-size:1.1875rem;font-weight:700;text-align:center;box-shadow:var(--shadow-off-sm);
    min-height:56px;display:flex;align-items:center;justify-content:center;
    font-family:'Andika',sans-serif;
  }
  .choice:active{transform:translate(3px,3px);box-shadow:none;}
  .choice[disabled]{opacity:.55;}
  .choice.correct{background:var(--sach-soft);border-color:var(--sach);}
  .choice.wrong{background:var(--deutsch-soft);border-color:var(--wrong);}
  .choice:focus-visible, .hill:focus-visible, .stop:focus-visible, .iconbtn:focus-visible, .speakbtn:focus-visible, .bigbtn:focus-visible{
    outline:3px solid var(--mathe);outline-offset:2px;
  }
  .feedback-banner{
    text-align:center;font-weight:700;font-size:1rem;margin-top:14px;min-height:22px;
  }
  .feedback-banner.correct{color:var(--sach);}
  .feedback-banner.wrong{color:var(--wrong);}

  /* ---------- round end ---------- */
  .roundend{text-align:center;}
  .roundend .big-emoji{font-size:4rem;margin-bottom:6px;}
  .roundend .stars-earned{font-size:1.375rem;font-weight:700;color:var(--star);margin:8px 0 22px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .bigbtn{
    border:3px solid var(--border);border-radius:18px;padding:14px;font-size:1.0625rem;font-weight:700;
    box-shadow:var(--shadow-off-sm);background:var(--mathe-soft);color:var(--text);
  }
  .bigbtn:active{transform:translate(3px,3px);box-shadow:none;}
  .bigbtn.ghost{background:var(--surface);}
  .bigbtn.violet{background:var(--violet-soft);}

  /* ---------- parent gate ---------- */
  .gate{text-align:center;}
  .panel.gate{border-color:var(--violet);}
  .gate input{
    font-family:inherit;font-size:1.375rem;text-align:center;width:120px;padding:10px;
    border:3px solid var(--border);border-radius:14px;margin:14px 0;background:var(--bg);color:var(--text);
  }
  .gate .err{color:var(--wrong);font-weight:700;font-size:0.875rem;min-height:20px;}

  /* ---------- parent dashboard ---------- */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
  @media (max-width:520px){.dash-grid{grid-template-columns:1fr;}}
  .dash-card{border:3px solid var(--border);border-radius:16px;padding:12px;background:var(--tint);}
  .dash-card h4{font-size:0.875rem;margin-bottom:6px;}
  .dash-card .stat{font-size:1.5rem;font-weight:700;}
  .dash-card .stat-sub{font-size:0.75rem;color:var(--text-soft);}
  .section-title{font-size:0.9375rem;font-weight:700;margin:22px 0 10px;}
  .wobbly-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .wobbly-item{
    display:flex;justify-content:space-between;gap:10px;border:2px solid var(--border);
    border-radius:12px;padding:8px 12px;font-size:0.875rem;background:var(--surface);
  }
  .wobbly-item .tag{font-size:0.6875rem;font-weight:700;color:var(--text-soft);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .filter-chip{border:2px solid var(--border);border-radius:14px;padding:5px 12px;font-size:0.8125rem;font-weight:700;background:var(--surface);}
  .filter-chip.active{background:var(--violet);color:#fff;border-color:var(--violet);}
  .log-table-wrap{overflow-x:auto;border:2px solid var(--border);border-radius:12px;}
  table.log{width:100%;border-collapse:collapse;font-size:0.8125rem;white-space:nowrap;}
  table.log th, table.log td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bg);}
  table.log th{background:var(--tint);position:sticky;top:0;}
  table.log td.ok{color:var(--sach);font-weight:700;}
  table.log td.bad{color:var(--wrong);font-weight:700;}
  .empty-note{color:var(--text-soft);font-size:0.875rem;text-align:center;padding:20px 0;}
  .danger-row{margin-top:22px;text-align:center;}
  .danger-btn{background:transparent;border:2px solid var(--wrong);color:var(--wrong);border-radius:12px;padding:8px 14px;font-weight:700;font-size:0.8125rem;}

  .loading{text-align:center;padding:60px 0;}
  .loading .mascot{font-size:3.25rem;animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @media (prefers-reduced-motion: reduce){
    .loading .mascot{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>

<div id="app"><div class="loading"><div class="mascot">🦔</div><p id="loadingmsg">Lernabenteuer wird vorbereitet …</p></div></div>

<script>
(function(){
'use strict';

/* =========================================================
   THEME (light / dark / auto)
   Applied as early as possible (before the storage/progress load)
   so there's no flash of the wrong theme. The CSS already defines
   :root[data-theme="dark"] and treats :root[data-theme="light"] as
   an escape hatch from the OS-level prefers-color-scheme media
   query - this just decides which one (if any) to set.
   ========================================================= */
var THEME_KEY = 'lernabenteuer_theme';
function loadThemePref(){
  try{
    var v = localStorage.getItem(THEME_KEY);
    return (v==='light'||v==='dark') ? v : 'auto';
  } catch(e){ return 'auto'; }
}
var themePref = loadThemePref();
function applyTheme(){
  if (themePref==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', themePref);
}
applyTheme();
function themeIcon(pref){ return pref==='light' ? '☀️' : (pref==='dark' ? '🌙' : '🌓'); }
function themeLabel(pref){ return pref==='light' ? 'Design: hell' : (pref==='dark' ? 'Design: dunkel' : 'Design: automatisch'); }
function cycleTheme(){
  themePref = themePref==='auto' ? 'light' : (themePref==='light' ? 'dark' : 'auto');
  try{ localStorage.setItem(THEME_KEY, themePref); } catch(e){}
  applyTheme();
  render();
}

/* =========================================================
   DATA: SUBJECTS + CURATED QUESTION BANKS
   ========================================================= */
var SUBJECTS = {
  deutsch: { name:'Deutsch', nameEN:'German', emoji:'🦊', tint:'deutsch-soft', color:'deutsch',
    topics: {
      buchstaben:{ name:'Buchstaben & Laute', nameEN:'Letters & Sounds', emoji:'🔤' },
      woerter:{ name:'Wörter & Bilder', nameEN:'Words & Pictures', emoji:'🖼️' },
      reime:{ name:'Reime', nameEN:'Rhymes', emoji:'🎵' }
    }
  },
  mathematik: { name:'Mathematik', nameEN:'Math', emoji:'🦉', tint:'mathe-soft', color:'mathe',
    topics: {

function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function uniqueDistractors(correct, min, max, count){
  var set = {}; set[correct]=true;
  var out=[];
  var guard=0;
  while(out.length<count && guard<200){
    guard++;
    var delta = Math.floor(Math.random()*5)+1;
    var sign = Math.random()<0.5?-1:1;
    var v = correct + sign*delta;
    if (v<min||v>max) v = correct + (-sign*delta);
    if (v<min||v>max) v = Math.min(max, Math.max(min, correct + (Math.random()<0.5?-1:1)));
    if (!set[v]){ set[v]=true; out.push(v); }
  }
  guard=0;
  while(out.length<count && guard<200){
    guard++;
    var r = min + Math.floor(Math.random()*(max-min+1));
    if (!set[r]){ set[r]=true; out.push(r); }
  }
  return out;
}

function genZahlenId(){
  var n = Math.floor(Math.random()*21);
  return 'mathematik.zahlen.n'+n;
}
function buildZahlenQuestion(id, param){
  var n = parseInt(param.slice(1),10);
  var distractors = uniqueDistractors(n,0,20,3);
  var choices = shuffle([n].concat(distractors)).map(String);
  return { id:id, subjectKey:'mathematik', topicKey:'zahlen',
    prompt:'Wie viele sind das?', displayType:'dots', display:n,
    choices:choices, answer:String(n) };
}

function genVergleichenId(){
  var a = 1+Math.floor(Math.random()*12);
  var b = 1+Math.floor(Math.random()*12);
  if (Math.random()<0.12) b=a;
  return 'mathematik.vergleichen.'+a+'-'+b;
}
function buildVergleichenQuestion(id, param){
  var parts = param.split('-');
  var a = parseInt(parts[0],10), b = parseInt(parts[1],10);
  var answer = a>b ? 'Links' : (b>a ? 'Rechts' : 'Gleich viel');
  var choices = (a===b) ? ['Links','Rechts','Gleich viel'] : ['Links','Rechts'];
  return { id:id, subjectKey:'mathematik', topicKey:'vergleichen',
    prompt:'Welche Seite hat mehr?', displayType:'compare', display:{a:a,b:b},
    choices:shuffle(choices), answer:answer };
}

function genRechnenId(){
  var op = Math.random()<0.6 ? 'plus':'minus';
  var a,b;
  if (op==='plus'){
    a = Math.floor(Math.random()*13);
    var maxB = Math.max(0, Math.min(12, 20-a));
    b = Math.floor(Math.random()*(maxB+1));
  } else {
    a = 1+Math.floor(Math.random()*20);
    b = Math.floor(Math.random()*(a+1));
  }
  return 'mathematik.rechnen.'+op+'-'+a+'-'+b;
}
function buildRechnenQuestion(id, param){
  var parts = param.split('-');
  var op = parts[0], a = parseInt(parts[1],10), b = parseInt(parts[2],10);
  var result = op==='plus' ? a+b : a-b;
  var sign = op==='plus' ? '+' : '\u2212';
  var text = a+' '+sign+' '+b+' = ?';
  var distractors = uniqueDistractors(result,0,20,3);
  var choices = shuffle([result].concat(distractors)).map(String);
  var showDots = (op==='plus' && a+b<=14) || (op==='minus' && a<=14);
  return { id:id, subjectKey:'mathematik', topicKey:'rechnen',
    prompt:text, displayType:'equation', display:{text:text, showDots:showDots, op:op, a:a, b:b},
    choices:choices, answer:String(result) };
}

var PROCEDURAL_TOPICS = {
  zahlen:{ gen:genZahlenId, build:buildZahlenQuestion },
  vergleichen:{ gen:genVergleichenId, build:buildVergleichenQuestion },
  rechnen:{ gen:genRechnenId, build:buildRechnenQuestion }
};

function getQuestionById(id){
  if (ALL_CURATED[id]){
    var src = ALL_CURATED[id];
    var copy = {};
    for (var k in src) copy[k]=src[k];
    copy.choices = shuffle(src.choices);
    return copy;
  }
  var dot1 = id.indexOf('.');
  var dot2 = id.indexOf('.', dot1+1);
  var subjectKey = id.slice(0,dot1);
  var topicKey = id.slice(dot1+1,dot2);
  var param = id.slice(dot2+1);
  var proc = PROCEDURAL_TOPICS[topicKey];
  if (proc) return proc.build(id, param);
  return null;
}

var storageMode = 'local';
var dbApi = null;
var DOC_PATH = 'progress/main';

function defaultProgress(){
  return {
    meta:{ createdAt:Date.now(), lastPlayedAt:null, streakDays:0, totalStars:0, totalRounds:0, totalAnswered:0, totalCorrect:0 },
    stats:{},
    log:[],
    daily: null,
    yesterdayShown: null,
    retentionHistory: []
  };
}
function defaultDaily(dateKeyStr){
  return { date:dateKeyStr, counts:{ deutsch:0, mathematik:0, sachkunde:0 }, bonus:false, retentionCheck:{attempted:0, correct:0} };
}
function mergeWithDefaults(data){
  var d = defaultProgress();
  if (!data || typeof data!=='object') return d;
  if (data.meta) for (var k in data.meta) d.meta[k]=data.meta[k];
  if (data.stats) d.stats = data.stats;
  if (data.log) d.log = data.log;
  if (data.daily && typeof data.daily==='object'){
    // Merge onto a fresh default shape (not a blind overwrite) so that if a
    // future release adds a field to the daily object, progress saved by an
    // older version of the app doesn't leave that field undefined and crash
    // recordAnswer()/ensureDaily() the next time it's read on the same day.
    var dd = defaultDaily(data.daily.date);
    for (var dk in data.daily) dd[dk] = data.daily[dk];
    dd.counts = {deutsch:0, mathematik:0, sachkunde:0};
    if (data.daily.counts) for (var ck in data.daily.counts) dd.counts[ck] = data.daily.counts[ck];
    dd.retentionCheck = {attempted:0, correct:0};
    if (data.daily.retentionCheck) for (var rk in data.daily.retentionCheck) dd.retentionCheck[rk] = data.daily.retentionCheck[rk];
    d.daily = dd;
  }
  if (data.yesterdayShown) d.yesterdayShown = data.yesterdayShown;
  if (data.retentionHistory) d.retentionHistory = data.retentionHistory;
  return d;
}

function initStorage(){

    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('db').then(function(d){
        if (d){ dbApi = d; storageMode = 'db'; }
        else { storageMode = 'local'; }
        resolve();
      }).catch(function(){ storageMode = 'local'; resolve(); });
    } else {
      storageMode = 'local';
      resolve();
    }
  });
}

function loadProgress(){
  if (storageMode === 'db'){
    return dbApi.doc(DOC_PATH).get().then(function(snap){
      if (snap.exists) return mergeWithDefaults(snap.data());
      return defaultProgress();
    }).catch(function(){
      storageMode = 'local';
      return loadProgressLocal();
    });
  }
  return Promise.resolve(loadProgressLocal());
}
function loadProgressLocal(){

    if (raw) return mergeWithDefaults(JSON.parse(raw));
  } catch(e){}
  return defaultProgress();
}

    dbApi.doc(DOC_PATH).set(progress).then(function(){
      storageWriteFailed = false;
    }).catch(function(){
      storageMode = 'local';
      saveProgressLocal();
    });

  }
  saveProgressLocal();
}

  } catch(e){ storageWriteFailed = true; }

/* =========================================================
   SPACED REPETITION ENGINE
   ========================================================= */
var BOX_INTERVAL_MS = [0, 0, 86400000, 3*86400000, 7*86400000, 14*86400000];
var ROUND_LEN = 8;

/* Daily caps per subject, weighted to match Baden-Württemberg's Grade-1
   weekly period ratio for these three subjects (Deutsch 6 : Mathematik 5 :
   Sachkunde 3, out of 14 total) scaled to a screen-time-friendly ~20
   exercises/day. Adjust here if a different daily total feels right. */
var DAILY_CAPS = { deutsch:9, mathematik:7, sachkunde:4 };

function dateKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function dateKeyFromTs(ts){ return dateKey(new Date(ts)); }

var CARRYOVER_FRACTION = 0.2; // ~20% of a round is deliberately drawn from yesterday's questions

function ensureDaily(){
  var todayK = dateKey(new Date());
  if (!progress.daily || progress.daily.date !== todayK){
    if (progress.daily){
      var oldDate = progress.daily.date;
      var idsShown = {};
      progress.log.forEach(function(entry){
        if (entry.id && dateKeyFromTs(entry.ts) === oldDate) idsShown[entry.id] = true;
      });
      progress.yesterdayShown = { date: oldDate, ids: Object.keys(idsShown) };
      if (progress.daily.retentionCheck && progress.daily.retentionCheck.attempted > 0){
        if (!progress.retentionHistory) progress.retentionHistory = [];
        progress.retentionHistory.unshift({
          date: oldDate,
          attempted: progress.daily.retentionCheck.attempted,
          correct: progress.daily.retentionCheck.correct
        });
        if (progress.retentionHistory.length > 30) progress.retentionHistory.length = 30;
      }
    }
    progress.daily = defaultDaily(todayK);
  }
}
function getCarryoverPoolIds(prefix){
  if (!progress.yesterdayShown) return [];
  return progress.yesterdayShown.ids.filter(function(id){ return id.indexOf(prefix)===0; });
}
function dailyUsed(subjectKey){
  ensureDaily();
  return progress.daily.counts[subjectKey]||0;
}
function dailyRemaining(subjectKey){
  ensureDaily();
  if (progress.daily.bonus) return Infinity;
  return Math.max(0, DAILY_CAPS[subjectKey] - dailyUsed(subjectKey));
}
function totalDailyProgress(){
  ensureDaily();
  var totalCap = 0, totalUsed = 0;
  Object.keys(DAILY_CAPS).forEach(function(k){
    totalCap += DAILY_CAPS[k];
    totalUsed += (progress.daily.counts[k]||0);
  });
  return { used:Math.min(totalUsed,totalCap), cap:totalCap, allDone: !progress.daily.bonus && totalUsed>=totalCap };
}

function ensureStat(q0){
  var st = progress.stats[q0.id];
  if (!st){
    st = progress.stats[q0.id] = {
      subject:q0.subjectKey, topic:q0.topicKey, label:q0.prompt,
      box:1, correctStreak:0, totalSeen:0, totalCorrect:0, totalWrong:0,
      maxBoxReached:1, dueAt:Date.now(), lastSeenAt:Date.now(), history:[]
    };
  }
  return st;
}

function recordAnswer(q0, isCorrect, isCarryover){
  var now = Date.now();
  ensureDaily();
  progress.daily.counts[q0.subjectKey] = (progress.daily.counts[q0.subjectKey]||0) + 1;
  var st = ensureStat(q0);
  st.label = q0.prompt;
  st.totalSeen++;
  st.lastSeenAt = now;
  if (isCorrect){
    st.totalCorrect++;
    st.correctStreak++;
    st.box = Math.min(5, st.box+1);
    st.maxBoxReached = Math.max(st.maxBoxReached, st.box);
  } else {
    st.totalWrong++;
    st.correctStreak = 0;
    st.box = 1;
  }
  st.dueAt = now + BOX_INTERVAL_MS[st.box];
  st.history.push({ts:now, correct:isCorrect});
  if (st.history.length>10) st.history.shift();

  progress.log.unshift({ts:now, id:q0.id, subject:q0.subjectKey, topic:q0.topicKey, label:q0.prompt, correct:isCorrect, box:st.box, carryover:!!isCarryover});
  if (progress.log.length>200) progress.log.length = 200;

  if (isCarryover){
    progress.daily.retentionCheck.attempted++;
    if (isCorrect) progress.daily.retentionCheck.correct++;
  }

  progress.meta.totalAnswered = (progress.meta.totalAnswered||0)+1;
  if (isCorrect) progress.meta.totalCorrect = (progress.meta.totalCorrect||0)+1;
  progress.meta.lastPlayedAt = now;
  saveProgress();
}

function getDueIds(prefix, now){
  return Object.keys(progress.stats).filter(function(id){
    return id.indexOf(prefix)===0 && progress.stats[id].dueAt<=now;
  }).sort(function(a,b){ return progress.stats[a].dueAt - progress.stats[b].dueAt; });
}

function pickNewId(subjectKey, topicKey, excludeSet){
  var bank = QUESTION_BANKS[subjectKey] && QUESTION_BANKS[subjectKey][topicKey];
  if (bank){
    var candidates = bank.filter(function(item){ return !excludeSet[item.id]; });
    if (!candidates.length) return null;
    var unseen = candidates.filter(function(item){ return !progress.stats[item.id]; });
    var pool = unseen.length ? unseen : candidates;
    return pool[Math.floor(Math.random()*pool.length)].id;
  }
  var proc = PROCEDURAL_TOPICS[topicKey];
  if (proc){
    var guard=0, id;
    do { id = proc.gen(); guard++; } while(excludeSet[id] && guard<30);
    return id;
  }
  return null;
}

function pickAnyId(subjectKey, topicKey){
  var bank = QUESTION_BANKS[subjectKey] && QUESTION_BANKS[subjectKey][topicKey];
  if (bank && bank.length) return bank[Math.floor(Math.random()*bank.length)].id;
  var proc = PROCEDURAL_TOPICS[topicKey];
  if (proc) return proc.gen();
  return null;
}

function buildRoundQueue(subjectKey, topicKey){
  var prefix = subjectKey+'.'+topicKey+'.';
  var now = Date.now();
  var excludeSet = {};
  var carryoverIds = [];
  var restIds = [];

  var pool = getCarryoverPoolIds(prefix);
  var carryoverTarget = pool.length ? Math.max(1, Math.round(ROUND_LEN * CARRYOVER_FRACTION)) : 0;
  carryoverTarget = Math.min(carryoverTarget, pool.length, ROUND_LEN);
  if (carryoverTarget > 0){
    shuffle(pool).slice(0, carryoverTarget).forEach(function(pid){
      if (!excludeSet[pid]){ excludeSet[pid]=true; carryoverIds.push(pid); }
    });
  }

  var guard = 0;
  while ((carryoverIds.length + restIds.length) < ROUND_LEN && guard < 60){
    guard++;
    var due = getDueIds(prefix, now).filter(function(id){ return !excludeSet[id]; });
    var pickedId = null;
    if (due.length && Math.random() < 0.55){
      pickedId = due[0];
    } else {
      pickedId = pickNewId(subjectKey, topicKey, excludeSet);
      if (!pickedId && due.length) pickedId = due[0];
      if (!pickedId) pickedId = pickAnyId(subjectKey, topicKey);
    }
    if (!pickedId) break;
    excludeSet[pickedId] = true;
    restIds.push(pickedId);
  }

  var carryoverMap = {};
  carryoverIds.forEach(function(id){ carryoverMap[id]=true; });
  return { queue: carryoverIds.concat(restIds), carryover: carryoverMap };
}

function topicMastery(subjectKey, topicKey){
  var prefix = subjectKey+'.'+topicKey+'.';
  var ids = Object.keys(progress.stats).filter(function(id){ return id.indexOf(prefix)===0; });
  if (!ids.length) return null;
  var mastered = ids.filter(function(id){ return progress.stats[id].box>=4; }).length;
  return Math.round(100*mastered/ids.length);
}
function subjectMastery(subjectKey){
  var topics = Object.keys(SUBJECTS[subjectKey].topics);
  var vals = topics.map(function(t){ return topicMastery(subjectKey,t); }).filter(function(v){ return v!==null; });
  if (!vals.length) return null;
  return Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
}
function retentionRate(subjectKey){
  var prefix = subjectKey+'.';
  var ids = Object.keys(progress.stats).filter(function(id){ return id.indexOf(prefix)===0; });
  var eligible = ids.filter(function(id){ return progress.stats[id].totalSeen>=2; });
  if (!eligible.length) return null;
  var retained = eligible.filter(function(id){
    var h = progress.stats[id].history;
    return h.length && h[h.length-1].correct;
  });
  return Math.round(100*retained.length/eligible.length);
}
function attemptedCount(subjectKey){
  var prefix = subjectKey+'.';
  return Object.keys(progress.stats).filter(function(id){ return id.indexOf(prefix)===0; }).length;
}
function wobblyCandidates(limit){
  return Object.keys(progress.stats).map(function(id){ return [id, progress.stats[id]]; })
    .filter(function(pair){ return pair[1].totalWrong>=1; })
    .sort(function(a,b){ return (b[1].totalWrong-a[1].totalWrong) || (b[1].lastSeenAt-a[1].lastSeenAt); })
    .slice(0, limit||6)
    .map(function(pair){ return {id:pair[0], st:pair[1]}; });
}

function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.88;
    var voices = window.speechSynthesis.getVoices();
    var de = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('de')===0; })[0];
    if (de) u.voice = de;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(ts){
  try{
    return new Date(ts).toLocaleString('de-DE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  } catch(e){ return ''; }
}
function shortDate(dk){

    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10), parseInt(parts[2],10));
    return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});

function renderDotGrid(n){

function renderTopics(){
  ensureDaily();
  var s = SUBJECTS[state.currentSubject];
  var remaining = dailyRemaining(state.currentSubject);
  var html = renderTopbar(true);
  html += '<div class="backrow"><button class="iconbtn" data-action="go-map">← Zurück</button><h2 style="font-size:1.125rem;">'+s.emoji+' '+s.name+'</h2></div>';
  html += '<div class="panel">';
  if (remaining<=0){
    html += '<div class="daily-banner done">🎉 Toll gemacht! Du hast dein Tagesziel für '+s.name+' erreicht. Komm morgen wieder!</div>';
  } else {
    html += '<p class="lead">Welche Station möchtest du besuchen? (noch '+remaining+' Aufgaben heute)</p>';
  }
  html += '<div class="stops">';
  Object.keys(s.topics).forEach(function(tk){
    var t = s.topics[tk];
    var mastery = topicMastery(state.currentSubject, tk);
    var badge = mastery===null ? 'Neu' : (mastery+'% gemeistert');
    var locked = remaining<=0;
    html += '<button class="stop'+(locked?' locked':'')+'" style="--tint:var(--'+s.tint+')" '+(locked?'':'data-action="start-round" data-subject="'+state.currentSubject+'" data-topic="'+tk+'"')+'>'+
      '<span class="emoji">'+t.emoji+'</span>'+
      '<span class="info"><h3>'+t.name+'</h3></span>'+
      '<span class="badge" style="background:var(--'+s.tint+')">'+(locked?'🔒':badge)+'</span>'+
      '</button>';
  });
  html += '</div></div>';
  return html;
}

function renderPlay(){
  var s = SUBJECTS[state.currentSubject];
  var qn = state.currentQuestion;
  var total = state.roundQueue.length;
  var dots = '';
  for (var i=0;i<total;i++){
    var cls = i<state.roundIndex ? 'done' : (i===state.roundIndex ? 'current' : '');
    dots += '<span class="'+cls+'"></span>';
  }
  var mascotFace = state.feedback==='correct' ? '🥳' : (state.feedback==='wrong' ? '🤔' : s.emoji);
  var html = '<div class="playhead">'+
    '<button class="iconbtn" data-action="leave-round">✕ Verlassen</button>'+
    '<div class="dots-progress">'+dots+'</div>'+
    '<span class="star-badge">⭐ '+state.starsThisRound+'</span>'+
    '</div>';
  html += '<div class="panel">';
  html += '<div class="mascot-row">'+mascotFace+'</div>';
  html += '<div class="prompt">'+escapeHtml(qn.prompt)+'</div>';
  html += '<button class="speakbtn" data-action="speak">🔊 Vorlesen</button>';
  html += renderVisual(qn);
  html += '<div class="choices">';
  qn.choices.forEach(function(c){
    var extraCls = '';
    if (state.feedback){
      if (c===qn.answer) extraCls = ' correct';
      else if (c===state.pickedChoice) extraCls = ' wrong';
    }
    html += '<button class="choice'+extraCls+'" data-action="answer" data-choice="'+escapeHtml(c)+'" '+(state.feedback?'disabled':'')+'>'+escapeHtml(c)+'</button>';
  });
  html += '</div>';
  var fbCls = state.feedback==='correct' ? 'correct' : (state.feedback==='wrong' ? 'wrong' : '');
  var fbText = state.feedback==='correct' ? 'Super gemacht! ⭐' : (state.feedback==='wrong' ? 'Fast! Das üben wir gleich nochmal.' : '');
  html += '<div class="feedback-banner '+fbCls+'" aria-live="polite">'+fbText+'</div>';
  html += '</div>';
  return html;
}

function renderRoundEnd(){
  var s = SUBJECTS[state.currentSubject];
  var html = renderTopbar(false);
  html += '<div class="panel roundend">';
  html += '<div class="big-emoji">🎉</div>';
  html += '<h2>Runde geschafft!</h2>';
  html += '<div class="stars-earned">⭐ '+state.starsThisRound+' Sterne verdient</div>';
  html += '<div class="stack">';
  html += '<button class="bigbtn" data-action="start-round" data-subject="'+state.currentSubject+'" data-topic="'+state.currentTopic+'">Nochmal spielen</button>';
  html += '<button class="bigbtn ghost" data-action="open-topics" data-subject="'+state.currentSubject+'">Andere Station</button>';
  html += '<button class="bigbtn ghost" data-action="go-map">Zur Startseite</button>';
  html += '</div></div>';
  return html;
}

function renderParentGate(){
  var g = state.parentGate;
  var html = '<div class="panel gate" lang="en">';
  html += '<h2 style="color:var(--violet);">For Parents</h2>';
  html += '<p class="lead" style="margin-top:10px;">Quick math check, so only grown-ups can see this:</p>';
  html += '<div style="font-size:1.625rem;font-weight:700;margin-top:10px;">'+g.a+' + '+g.b+' = ?</div>';
  html += '<input type="number" inputmode="numeric" id="gate-input" value="'+(g.input||'')+'" autofocus>';
  html += '<div class="err">'+(g.error||'')+'</div>';
  html += '<div class="stack">';
  html += '<button class="bigbtn violet" data-action="check-gate">Confirm</button>';
  html += '<button class="bigbtn ghost" data-action="go-map">Cancel</button>';
  html += '</div></div>';
  return html;
}

function renderParentDash(){
  ensureDaily();
  var html = '<div lang="en">';
  html += '<div class="topbar"><h1 style="font-size:1.25rem;color:var(--violet);">For Parents</h1><button class="iconbtn violet" data-action="go-map">Done</button></div>';
  html += '<div class="panel">';

  if (storageWriteFailed){
    html += '<div class="daily-banner" style="background:var(--deutsch-soft);border-color:var(--wrong);color:var(--wrong);margin-bottom:16px;">'+
      '⚠️ Progress could not be saved on this device (storage may be full or blocked). Recent activity may be lost.</div>';
  }

  var dp = totalDailyProgress();
  html += '<div class="section-title" style="margin-top:0;">Today</div>';
  html += '<div class="dash-card" style="--tint:var(--violet-soft);margin-bottom:20px;">';
  html += '<p style="margin-bottom:4px;">'+dp.used+' / '+dp.cap+' exercises done today'+(progress.daily.bonus?' <strong>(daily limit lifted)</strong>':'')+'</p>';
  html += '<p class="stat-sub" style="margin-bottom:10px;">Daily targets: German '+DAILY_CAPS.deutsch+' · Math '+DAILY_CAPS.mathematik+' · General Studies '+DAILY_CAPS.sachkunde+' - weighted to match Grade 1 weekly class hours (6:5:3), sized to keep daily screen time short.</p>';
  html += '<button class="iconbtn violet" data-action="toggle-bonus">'+(progress.daily.bonus?'Restore daily limit':'Allow extra practice today')+'</button>';
  html += '</div>';

  html += '<div class="section-title">Day-over-day retention</div>';
  html += '<div class="dash-card" style="--tint:var(--violet-soft);margin-bottom:20px;">';
  html += '<p class="stat-sub" style="margin-bottom:10px;">About 20% of each day\'s exercises are quietly re-served from what your child saw the day before - not repeated right away (kids find that frustrating), but a day later, once it would otherwise start fading. This tracks specifically how those repeats go, which is a cleaner read on real retention than overall accuracy.</p>';
  var rc = progress.daily.retentionCheck || {attempted:0, correct:0};
  if (rc.attempted>0){
    var pct = Math.round(100*rc.correct/rc.attempted);
    html += '<p><strong>Today:</strong> '+rc.correct+' / '+rc.attempted+' correct on yesterday\'s repeats ('+pct+'%)</p>';
  } else {
    html += '<p class="stat-sub">No repeat questions answered yet today.</p>';
  }
  var hist = (progress.retentionHistory||[]).slice(0,7);
  if (hist.length){
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">';
    hist.forEach(function(h){
      var hpct = h.attempted ? Math.round(100*h.correct/h.attempted) : 0;
      html += '<span class="tag" style="border:2px solid var(--border);border-radius:10px;padding:4px 8px;">'+shortDate(h.date)+': '+hpct+'%</span>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="dash-grid">';
  Object.keys(SUBJECTS).forEach(function(key){
    var s = SUBJECTS[key];
    var mastery = subjectMastery(key);
    var retention = retentionRate(key);
    var count = attemptedCount(key);
    html += '<div class="dash-card" style="--tint:var(--'+s.tint+')">'+
      '<h4>'+s.emoji+' '+s.nameEN+'</h4>'+
      '<div class="stat">'+(mastery===null?'–':mastery+'%')+'</div>'+
      '<div class="stat-sub">Mastery</div>'+
      '<div class="bar"><div style="width:'+(mastery||0)+'%;--fill:var(--'+s.color+')"></div></div>'+
      '<div class="stat-sub" style="margin-top:8px;">Recent accuracy: '+(retention===null?'–':retention+'%')+' · '+count+' exercises practiced</div>'+
      '</div>';
  });
  html += '</div>';

  html += '<div class="section-title">Needs more practice (frequently missed)</div>';
  var wobbly = wobblyCandidates(6);
  if (!wobbly.length){
    html += '<p class="empty-note">Nothing to flag yet - keep it up!</p>';
  } else {
    html += '<div class="wobbly-list">';
    wobbly.forEach(function(w){
      var s = SUBJECTS[w.st.subject];
      var t = s.topics[w.st.topic];
      html += '<div class="wobbly-item"><span>'+escapeHtml(w.st.label)+'<br><span class="tag">'+s.nameEN+' · '+t.nameEN+'</span></span><span class="tag">'+w.st.totalWrong+'× wrong</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="section-title">Activity Log</div>';
  html += '<div class="filters">';
  ['alle','deutsch','mathematik','sachkunde'].forEach(function(f){
    var label = f==='alle' ? 'All' : SUBJECTS[f].nameEN;
    html += '<button class="filter-chip'+(state.dashFilter===f?' active':'')+'" data-action="set-filter" data-filter="'+f+'">'+label+'</button>';
  });
  html += '</div>';

  var log = progress.log.filter(function(entry){
    return state.dashFilter==='alle' || entry.subject===state.dashFilter;
  }).slice(0,60);

  if (!log.length){
    html += '<p class="empty-note">No activity yet in this view.</p>';
  } else {
    html += '<div class="log-table-wrap"><table class="log"><thead><tr><th>Date</th><th>Subject</th><th>Topic</th><th>Question</th><th>Result</th></tr></thead><tbody>';
    log.forEach(function(entry){
      var s = SUBJECTS[entry.subject];
      var t = s.topics[entry.topic];
      var tagIcon = entry.carryover ? ' 🔁' : '';
      html += '<tr><td>'+fmtDate(entry.ts)+'</td><td>'+s.nameEN+'</td><td>'+t.nameEN+'</td><td>'+escapeHtml(entry.label)+tagIcon+'</td>'+
        '<td class="'+(entry.correct?'ok':'bad')+'">'+(entry.correct?'✓ richtig':'✗ falsch')+'</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="stat-sub" style="margin-top:6px;">🔁 = a deliberate repeat from the previous day\'s session</p>';
  }

  html += '<div class="danger-row">';
  if (state.confirmReset){
    html += '<p style="font-weight:700;color:var(--wrong);margin-bottom:10px;">Are you sure you want to delete all progress? This cannot be undone.</p>';
    html += '<div style="display:flex;gap:10px;justify-content:center;">';
    html += '<button class="danger-btn" style="background:var(--wrong);color:#fff;" data-action="reset-progress-yes">Yes, delete</button>';
    html += '<button class="iconbtn" data-action="reset-progress-cancel">Cancel</button>';
    html += '</div>';
  } else {
    html += '<button class="danger-btn" data-action="reset-progress-ask">Reset progress</button>';
  }
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function goMap(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  state.view='map';
  render();
}
function openTopics(subjectKey){
  state.currentSubject = subjectKey;
  state.view='topics';
  render();
}
function startRound(subjectKey, topicKey){
  var remaining = dailyRemaining(subjectKey);
  if (remaining <= 0){
    state.currentSubject = subjectKey;
    state.view = 'topics';
    render();
    return;
  }
  state.roundToken = (state.roundToken||0) + 1;
  state.currentSubject = subjectKey;
  state.currentTopic = topicKey;
  var built = buildRoundQueue(subjectKey, topicKey);
  var queue = built.queue;
  if (queue.length > remaining) queue = queue.slice(0, remaining);
  state.roundQueue = queue;
  state.roundCarryover = built.carryover;
  state.roundIndex = 0;
  state.starsThisRound = 0;
  state.feedback = null;
  state.pickedChoice = null;
  progress.meta.totalRounds = (progress.meta.totalRounds||0)+1;
  updateStreak();
  loadCurrentQuestion();
  state.view='play';
  render();
}
function updateStreak(){
  var now = new Date();
  var todayKey = dateKey(now);
  var last = progress.meta.lastPlayedAt ? new Date(progress.meta.lastPlayedAt) : null;
  if (!last){ progress.meta.streakDays = 1; }
  else {
    var lastKey = dateKey(last);
    if (lastKey===todayKey){ /* same day, keep */ }
    else {
      var lastMidnight = new Date(last.getFullYear(),last.getMonth(),last.getDate());
      var todayMidnight = new Date(now.getFullYear(),now.getMonth(),now.getDate());
      var diffDays = Math.round((todayMidnight - lastMidnight) / 86400000);
      if (diffDays===1) progress.meta.streakDays = (progress.meta.streakDays||0)+1;
      else progress.meta.streakDays = 1;
    }
  }
}
function loadCurrentQuestion(){
  var id = state.roundQueue[state.roundIndex];
  state.currentQuestion = getQuestionById(id);
}
function handleAnswer(choice){
  if (state.feedback) return;
  var qn = state.currentQuestion;
  var isCorrect = choice === qn.answer;
  var isCarryover = !!(state.roundCarryover && state.roundCarryover[qn.id]);
  var myToken = state.roundToken;
  state.pickedChoice = choice;
  state.feedback = isCorrect ? 'correct' : 'wrong';
  recordAnswer(qn, isCorrect, isCarryover);
  if (isCorrect){
    state.starsThisRound++;
    progress.meta.totalStars = (progress.meta.totalStars||0)+1;
  } else {
    var insertAt = Math.min(state.roundQueue.length, state.roundIndex + 3 + Math.floor(Math.random()*2));
    state.roundQueue.splice(insertAt, 0, qn.id);
  }
  render();
  setTimeout(function(){
    // Guard against the player having left this round (or started a new one)
    // while this timer was pending - otherwise a stale timer can silently
    // yank the screen to a different view than whatever was just tapped.
    if (state.roundToken !== myToken || state.view !== 'play') return;
    state.feedback = null;
    state.pickedChoice = null;
    state.roundIndex++;
    if (state.roundIndex >= state.roundQueue.length){
      state.view = 'roundend';
      render();
    } else {
      loadCurrentQuestion();
      render();
    }
  }, isCorrect ? 850 : 1500);
}
function leaveRound(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  state.roundToken = (state.roundToken||0) + 1;
  state.view='topics';
  render();
}
function openParentGate(){
  var a = 12+Math.floor(Math.random()*40);
  var b = 7+Math.floor(Math.random()*30);
  state.parentGate = {a:a, b:b, input:'', error:''};
  state.view='parentgate';
  render();
}
function checkGate(){
  var input = document.getElementById('gate-input');
  var val = input ? parseInt(input.value,10) : NaN;
  var g = state.parentGate;
  if (val === g.a+g.b){
    state.dashFilter = 'alle';
    state.confirmReset = false;
    state.view = 'parentdash';
    render();
  } else {
    g.error = 'Not quite - try again.';
    render();
  }
}
function setFilter(f){
  state.dashFilter = f;
  render();
}
function toggleBonus(){
  ensureDaily();
  progress.daily.bonus = !progress.daily.bonus;
  saveProgress();
  render();
}
function askResetProgress(){
  state.confirmReset = true;
  render();
}
function cancelResetProgress(){
  state.confirmReset = false;
  render();
}
function resetProgress(){
  progress = defaultProgress();
  state.confirmReset = false;
  saveProgress();
  render();
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.getElementById('app').addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  var action = el.getAttribute('data-action');
  if (action==='go-map') goMap();
  else if (action==='open-topics') openTopics(el.getAttribute('data-subject'));
  else if (action==='start-round') startRound(el.getAttribute('data-subject'), el.getAttribute('data-topic'));
  else if (action==='answer') handleAnswer(el.getAttribute('data-choice'));
  else if (action==='speak') speak(state.currentQuestion.prompt);
  else if (action==='leave-round') leaveRound();
  else if (action==='open-parent-gate') openParentGate();
  else if (action==='cycle-theme') cycleTheme();
  else if (action==='check-gate') checkGate();
  else if (action==='set-filter') setFilter(el.getAttribute('data-filter'));
  else if (action==='toggle-bonus') toggleBonus();
  else if (action==='reset-progress-ask') askResetProgress();
  else if (action==='reset-progress-yes') resetProgress();
  else if (action==='reset-progress-cancel') cancelResetProgress();
});
document.getElementById('app').addEventListener('keydown', function(e){
  if (e.key==='Enter' && state.view==='parentgate'){
    var active = document.activeElement;
    if (active && active.id==='gate-input') checkGate();
  }
});

/* =========================================================
   BOOT
   ========================================================= */
initStorage().then(loadProgress).then(function(p){
  progress = p;
  state.view = 'map';
  render();
});

})();
</script>
